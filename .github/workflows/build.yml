# Automatic build (continuous integration, "CI").
#
# On every pull request and every push to main, GitHub starts a Windows machine,
# compiles Prunel and checks the data files. The result (green tick or red cross)
# shows on the pull request. Nothing is published: it is only a check.
#
# The eyetracker DLLs are not needed: the Tobii.Interaction package is downloaded from
# NuGet only to compile (see Prunel.csproj), and nothing is run.

name: Build

on:
  pull_request:
  push:
    branches: [main]
  # Allows starting the build by hand from the "Actions" tab.
  workflow_dispatch:

# Read-only access to the repository: this workflow changes nothing.
permissions:
  contents: read

# A new push on the same branch cancels the build still running for the old one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Check the language and keyboard files
        shell: pwsh
        run: ./.github/scripts/check-data-files.ps1

      - name: Check the two manifests (normal and with UI access)
        shell: pwsh
        run: ./.github/scripts/check-manifests.ps1

      - name: Check the installer script (setup-certificate.ps1)
        shell: powershell
        run: ./.github/scripts/check-install-scripts.ps1

      # First the "full installation" build, with UI access (UiAccess=true, see
      # Prunel.csproj), in its own folders (bin/uiaccess, obj/uiaccess), apart from the normal build.
      - name: Compile the full installation build (UI access)
        run: dotnet build Prunel.csproj --configuration Release -p:UiAccess=true -p:OutDir=${{ github.workspace }}/bin/uiaccess/ -p:IntermediateOutputPath=obj/uiaccess/

      # The installer (Setup.exe, made with Inno Setup) of this same build. Its version number
      # is the <Version> of Prunel.csproj.
      - name: Make the installer (Setup.exe)
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Prunel.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          ./.github/scripts/make-setup.ps1 bin/uiaccess $version bin/setup

      - name: Compile Prunel (Release, x86)
        run: dotnet build Prunel.csproj --configuration Release

      - name: Check that the normal build does not ask for UI access
        shell: pwsh
        run: ./.github/scripts/check-exe-manifest.ps1 bin/Release/net48/Prunel.exe false

      - name: Check that no eyetracker DLL is in the output
        shell: pwsh
        run: |
          $found = Get-ChildItem bin -Recurse -Filter 'Tobii*.dll'
          if ($found) {
            $found | ForEach-Object { Write-Host "::error::Eyetracker DLL in the output: $($_.FullName)" }
            exit 1
          }
          Write-Host 'OK: no eyetracker DLL in the output.'

      # The compiled program can be downloaded from the build page for 14 days
      # (for testing a pull request without compiling it yourself).
      - name: Keep the compiled program
        uses: actions/upload-artifact@v6
        with:
          name: Prunel-${{ github.sha }}
          path: bin/Release/net48/
          retention-days: 14

      # The installer, to test it before a release: double-click Prunel-<version>-setup.exe
      # in the downloaded zip (see docs/manual-tests.md, "Installer (Setup.exe)").
      - name: Keep the installer
        uses: actions/upload-artifact@v6
        with:
          name: Prunel-setup-${{ github.sha }}
          path: bin/setup/
          retention-days: 14
